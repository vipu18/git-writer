name: Sync Git Writer Upstream Releases

on:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/sync-upstream-release.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: git-writer-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Find latest stable upstream release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/jotalac/git-writer/releases/latest --jq .tag_name)"
          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected stable upstream release: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null |
             grep -qE '\.pkg\.tar\.zst$'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Arch release $tag already published."
          fi

      - name: Merge upstream release into fork
        if: steps.release.outputs.ready != 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote add upstream https://github.com/jotalac/git-writer.git
          git fetch --no-tags upstream "refs/tags/$TAG"
          release_commit="$(git rev-parse FETCH_HEAD^{commit})"

          if ! git merge --no-edit --no-ff \
            -m "Merge upstream Git Writer release $TAG" "$release_commit"; then
            git merge --abort || true
            echo "::error::Conflict merging upstream $TAG; resolve manually. No forced push attempted."
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            git push origin HEAD:refs/heads/master
          fi

          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git tag "$TAG" HEAD
            git push origin "refs/tags/$TAG"
          fi

      - name: Dispatch Arch Linux packaging
        if: steps.release.outputs.ready != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run arch-package.yml --ref "$TAG"
          echo "Triggered Git Writer Arch package build for $TAG"
